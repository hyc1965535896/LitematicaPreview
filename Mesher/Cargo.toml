[package]
name = "litematica-preview-native"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
name = "litematica_preview_native"
crate-type = ["rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
# The desktop host catches recoverable mesher panics.
panic = "unwind"

[dependencies]
nucleation = { version = "=0.10.14", default-features = false, features = ["meshing"] }
schematic-mesher = "=0.2.0"
base64 = "0.21.7"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quartz_nbt = { version = "0.2.9", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
base64 = "0.21.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
