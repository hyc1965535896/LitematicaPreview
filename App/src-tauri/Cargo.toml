[package]
name = "litematica-preview"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "LitematicaPreview"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
litematica-preview-native = { path = "../../Mesher" }
nucleation = { version = "=0.10.14", default-features = false, features = ["meshing"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
# A bad schematic must not terminate the window or poison the cached pack.
panic = "unwind"
strip = "debuginfo"
